<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Animal World - Learn & Play!</title>
    <style>
        /* Colorful Baby-Friendly Theme */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif;
            user-select: none;
        }

        body {
            background-color: #f0fdf4;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: #ff5964;
            font-size: 2.5rem;
            text-shadow: 2px 2px #ffe66d;
        }

        .subtitle {
            color: #35a7ff;
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 5px;
        }

        /* Main Game Display Card */
        .game-card {
            background-color: #ffffff;
            border: 6px solid #35a7ff;
            border-radius: 30px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
        }

        .animal-display {
            width: 200px;
            height: 200px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fff9a6;
            border-radius: 50%;
            border: 4px dashed #ff5964;
            transition: transform 0.3s ease;
        }

        .animal-display svg {
            width: 140px;
            height: 140px;
        }

        /* Interactive Buttons */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .btn-option {
            background-color: #ffe66d;
            border: 4px solid #fb8b24;
            border-radius: 20px;
            padding: 15px;
            font-size: 1.4rem;
            font-weight: bold;
            color: #2b2d42;
            cursor: pointer;
            box-shadow: 0 5px 0px #fb8b24;
            transition: all 0.1s ease;
        }

        .btn-option:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0px #fb8b24;
        }

        /* Correct / Incorrect Highlights */
        .btn-option.correct {
            background-color: #38b000 !important;
            color: white !important;
            border-color: #007200 !important;
            box-shadow: 0 5px 0px #007200 !important;
        }

        .btn-option.wrong {
            background-color: #ff4d6d !important;
            color: white !important;
            border-color: #c9184a !important;
            box-shadow: 0 5px 0px #c9184a !important;
            animation: shake 0.3s;
        }

        /* Celebration Text Banner */
        .feedback-message {
            height: 40px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #38b000;
            margin-top: 15px;
        }

        .btn-next {
            background-color: #ff5964;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 0px #d90429;
            margin-top: 10px;
            display: none;
        }

        .btn-next:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0px #d90429;
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
            100% { transform: translateX(0); }
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15) rotate(5deg); }
        }

        .bounce {
            animation: bounce 0.6s ease;
        }
    </style>
</head>
<body>

    <header>
        <h1>🐾 Baby Animal World 🎈</h1>
        <p class="subtitle">Touch the correct name!</p>
    </header>

    <main class="game-card">
        <div class="animal-display" id="animalContainer">
            <!-- Cartoon Animal Vector Graphics rendering here -->
        </div>

        <div class="options-grid" id="optionsGrid">
            <!-- Choice buttons will generate dynamically -->
        </div>

        <div class="feedback-message" id="feedback"></div>
        <button class="btn-next" id="nextBtn" onclick="loadNewQuestion()">Next Animal ➔</button>
    </main>

    <script>
        // Cartoon SVG Animals database
        const animals = [
            {
                name: "Dog",
                svg: `<svg viewBox="0 0 100 100">
                    <circle cx="50" cy="55" r="30" fill="#d4a373"/>
                    <circle cx="35" cy="50" r="4" fill="#000"/>
                    <circle cx="65" cy="50" r="4" fill="#000"/>
                    <ellipse cx="50" cy="60" rx="6" ry="4" fill="#000"/>
                    <ellipse cx="22" cy="40" rx="8" ry="18" fill="#a5a58d" transform="rotate(15 22 40)"/>
                    <ellipse cx="78" cy="40" rx="8" ry="18" fill="#a5a58d" transform="rotate(-15 78 40)"/>
                    <path d="M 46 66 Q 50 72 54 66" stroke="#000" stroke-width="2" fill="none"/>
                </svg>`
            },
            {
                name: "Cat",
                svg: `<svg viewBox="0 0 100 100">
                    <circle cx="50" cy="55" r="30" fill="#ffb703"/>
                    <polygon points="25,35 35,15 45,30" fill="#ffb703"/>
                    <polygon points="75,35 65,15 55,30" fill="#ffb703"/>
                    <circle cx="38" cy="50" r="4" fill="#000"/>
                    <circle cx="62" cy="50" r="4" fill="#000"/>
                    <polygon points="50,58 46,54 54,54" fill="#ff4d6d"/>
                    <line x1="20" y1="55" x2="32" y2="55" stroke="#000" stroke-width="2"/>
                    <line x1="80" y1="55" x2="68" y2="55" stroke="#000" stroke-width="2"/>
                </svg>`
            },
            {
                name: "Panda",
                svg: `<svg viewBox="0 0 100 100">
                    <circle cx="50" cy="55" r="32" fill="#ffffff" stroke="#000" stroke-width="3"/>
                    <circle cx="25" cy="30" r="12" fill="#000"/>
                    <circle cx="75" cy="30" r="12" fill="#000"/>
                    <ellipse cx="38" cy="50" rx="7" ry="9" fill="#000"/>
                    <ellipse cx="62" cy="50" rx="7" ry="9" fill="#000"/>
                    <circle cx="38" cy="48" r="2" fill="#fff"/>
                    <circle cx="62" cy="48" r="2" fill="#fff"/>
                    <ellipse cx="50" cy="62" rx="5" ry="3" fill="#000"/>
                </svg>`
            },
            {
                name: "Frog",
                svg: `<svg viewBox="0 0 100 100">
                    <circle cx="50" cy="60" r="28" fill="#52b788"/>
                    <circle cx="35" cy="35" r="12" fill="#52b788"/>
                    <circle cx="65" cy="35" r="12" fill="#52b788"/>
                    <circle cx="35" cy="35" r="5" fill="#fff"/>
                    <circle cx="65" cy="35" r="5" fill="#fff"/>
                    <circle cx="35" cy="35" r="2" fill="#000"/>
                    <circle cx="65" cy="35" r="2" fill="#000"/>
                    <path d="M 38 65 Q 50 75 62 65" stroke="#000" stroke-width="3" fill="none"/>
                    <circle cx="30" cy="58" r="4" fill="#ff70a6" opacity="0.6"/>
                    <circle cx="70" cy="58" r="4" fill="#ff70a6" opacity="0.6"/>
                </svg>`
            },
            {
                name: "Bear",
                svg: `<svg viewBox="0 0 100 100">
                    <circle cx="50" cy="55" r="30" fill="#9c6644"/>
                    <circle cx="28" cy="30" r="10" fill="#9c6644"/>
                    <circle cx="72" cy="30" r="10" fill="#9c6644"/>
                    <circle cx="28" cy="30" r="5" fill="#ddb892"/>
                    <circle cx="72" cy="30" r="5" fill="#ddb892"/>
                    <ellipse cx="50" cy="62" rx="12" ry="9" fill="#ddb892"/>
                    <circle cx="38" cy="48" r="3" fill="#000"/>
                    <circle cx="62" cy="48" r="3" fill="#000"/>
                    <ellipse cx="50" cy="59" rx="4" ry="3" fill="#000"/>
                </svg>`
            }
        ];

        let currentAnimal = null;
        let canClick = true;

        // Built-in Text-to-Speech function for audio feedback
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop previous voice
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.pitch = 1.3; // Make voice sound cheerful/kid-friendly
                utterance.rate = 0.9;  // Slightly slower for babies
                window.speechSynthesis.speak(utterance);
            }
        }

        function loadNewQuestion() {
            canClick = true;
            document.getElementById('feedback').innerText = '';
            document.getElementById('nextBtn').style.display = 'none';

            // Select random animal
            const randomIndex = Math.floor(Math.random() * animals.length);
            currentAnimal = animals[randomIndex];

            // Render SVG Picture
            const container = document.getElementById('animalContainer');
            container.innerHTML = currentAnimal.svg;
            container.classList.remove('bounce');

            // Generate choices (correct choice + 3 random distinct options)
            let choices = [currentAnimal.name];
            while (choices.length < 4) {
                const randomOption = animals[Math.floor(Math.random() * animals.length)].name;
                if (!choices.includes(randomOption)) {
                    choices.push(randomOption);
                }
            }

            // Shuffle choice buttons
            choices.sort(() => Math.random() - 0.5);

            // Render buttons
            const optionsGrid = document.getElementById('optionsGrid');
            optionsGrid.innerHTML = '';
            choices.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerText = option;
                btn.onclick = () => checkAnswer(btn, option);
                optionsGrid.appendChild(btn);
            });

            // Read prompt out loud
            speak("What animal is this?");
        }

        function checkAnswer(selectedBtn, selectedName) {
            if (!canClick) return;

            if (selectedName === currentAnimal.name) {
                // CORRECT ANSWER
                canClick = false;
                selectedBtn.classList.add('correct');
                
                const container = document.getElementById('animalContainer');
                container.classList.add('bounce');

                document.getElementById('feedback').innerText = '🎉 Yay! Great Job! 🎉';
                speak("Yay! Great Job! It is a " + currentAnimal.name);

                document.getElementById('nextBtn').style.display = 'inline-block';
            } else {
                // INCORRECT ANSWER
                selectedBtn.classList.add('wrong');
                speak("Try again!");
                setTimeout(() => {
                    selectedBtn.classList.remove('wrong');
                }, 500);
            }
        }

        // Initialize game on startup
        window.onload = loadNewQuestion;
    </script>
</body>
</html>
